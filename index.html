<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Some Quotes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background decoration -->

    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <!-- Main content -->

    <main class="page">

        <div class="content">

            <div class="logo">
                Some Quotes
            </div>

            <h1>
                The Quote
            </h1>

            <div class="quote-card">

                <div class="quote-mark left">
                    “
                </div>

                <p id="quote" class="loading">
                    Loading...
                </p>

                <div class="quote-mark right">
                    ”
                </div>

            </div>

            <footer>
                A little inspiration, whenever you need it.<br>
                Made by Rui Song
            </footer>

        </div>

    </main>

    <script>

        async function loadQuote() {

            const quoteElement =
                document.getElementById("quote");

            // Start loading animation
            quoteElement.classList.remove("fade");
            quoteElement.classList.add("loading");

            try {

                const response = await fetch("/api/quote", {
                    method: "GET",
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("Failed to load quote");
                }

                const data = await response.json();

                quoteElement.textContent =
                    data.quote || "Testing";

                // Re-trigger animation
                void quoteElement.offsetWidth;

                quoteElement.classList.remove("loading");
                quoteElement.classList.add("fade");

            } catch (error) {

                console.error(error);

                quoteElement.textContent =
                    "Unable to load the quote.";

                quoteElement.classList.remove("loading");
                quoteElement.classList.add("fade");
            }
        }

        // Load quote when page opens
        loadQuote();

    </script>

</body>
</html>
